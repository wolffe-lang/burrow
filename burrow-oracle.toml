# The oracle: OpenSSH portable, built from its signed release tarball with
# its own default configure (only --prefix is set), never read. Only the
# tarball's top-level PROTOCOL* notes are consulted (docs/SOURCES.md).
# 10.0p2 is the last release whose tarball carries PROTOCOL.chacha20poly1305
# and PROTOCOL.certkeys; 10.1p1 onward points at Internet-Drafts instead.
[oracle]
version = "10.0p2"
version_line = "OpenSSH_10.0p2, OpenSSL 3.0.13 30 Jan 2024"
