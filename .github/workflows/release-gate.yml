# Generated from ci.yml by the pinned release-adapter; checked for drift.
name: release gate
on:
  workflow_call:
    outputs:
      tested-sha:
        description: Exact tag commit whose complete release gate succeeded
        value: ${{ jobs.complete.outputs.tested-sha }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        name: exact stable tag commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  plan:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix') }}
        with:
          fetch-depth: 2
      - id: plan
        if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix') }}
        env:
          EVENT: workflow_dispatch
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IN_JOBS: ${{ inputs.jobs }}
        run: python3 -I ci/tiers.py plan --merge --github-output "$GITHUB_OUTPUT"
      - name: local gate wiring proof
        if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix') }}
        run: python3 -I ci/local-gate-test.py
      - name: local evidence gate
        if: ${{ !(github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) }}
        run: echo 'Local gauntlet evidence is the gate; request ci or full-matrix for CI.'
  plan-test:
    needs: plan
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) && (contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'plan-test')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I ci/tiers-test.py
      - run: python3 -I ci/fetch-retry-test.py
      - run: python3 -I tools/vectorgen.py --check src/kexvec/kexvec.lu
      - run: python3 -I tools/nistvec.py --check ci/vectors/nist-sha1.rsp src/sha1vec/sha1vec.lu
  linux:
    needs: plan
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) && (contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'linux')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BURROW_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
      - name: Cache digest-pinned oracle and toolchain
        uses: actions/cache@v4
        with:
          path: |
            .wolf-bin
            .oracle
          key: burrow-linux-${{ hashFiles('wolf-toolchain.toml', 'burrow-oracle.toml', 'ci/oracle.Containerfile', 'tools/fetch-oracle') }}
      - name: Build own pinned Ubuntu container
        run: |
          base=$(awk '$1 == "FROM" { print $2; exit }' ci/oracle.Containerfile)
          python3 -I ci/fetch-retry run "the base image $base" -- docker pull -q "$base"
          tools/in-container true
      - name: Stage digest-pinned toolchain and the OpenSSH oracle
        id: stage
        run: tools/in-container sh -c 'tools/fetch-toolchain && tools/fetch-oracle'
      - name: Vectors regenerate byte for byte
        run: python3 -I tools/vectorgen.py --check src/kexvec/kexvec.lu && python3 -I tools/nistvec.py --check ci/vectors/nist-sha1.rsp src/sha1vec/sha1vec.lu
      - name: Format and both compiler tiers
        run: tools/in-container sh -c 'tools/check-fmt && tools/build --all'
      - name: Unit rows on the checked machine, native and lupin
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: tools/in-container tools/check-test
      - name: Transport rows against the pinned sshd, native
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: tools/in-container python3 -I tools/check-transport --bin target/native/burrow
      - name: Transport rows against the pinned sshd, release
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: tools/in-container python3 -I tools/check-transport --bin target/release/burrow
      - name: Session rows against the pinned sshd, ssh and ssh-keygen, native
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: tools/in-container python3 -I tools/check-session --bin target/native/burrow
      - name: Session rows against the pinned sshd, ssh and ssh-keygen, release
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: tools/in-container python3 -I tools/check-session --bin target/release/burrow
      - name: Keystroke timing rows against the pinned ssh and sshd, native
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: tools/in-container python3 -I tools/check-session --bin target/native/burrow --timing
      - name: Keystroke timing rows against the pinned ssh and sshd, release
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: tools/in-container python3 -I tools/check-session --bin target/release/burrow --timing
      - name: Hostile-peer rows (tools/fakeserver.py), native
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: tools/in-container python3 -I tools/check-hostile --bin target/native/burrow
      - name: Hostile-peer rows (tools/fakeserver.py), release
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: tools/in-container python3 -I tools/check-hostile --bin target/release/burrow
      - name: Server rows against the pinned sshd, native
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: tools/in-container python3 -I tools/check-server --bin target/native/burrowd
      - name: Server rows against the pinned sshd, release
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: tools/in-container python3 -I tools/check-server --bin target/release/burrowd
      - name: Hostile-client rows (tools/fakeclient.py), native
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: tools/in-container python3 -I tools/check-server-hostile --bin target/native/burrowd
      - name: Hostile-client rows (tools/fakeclient.py), release
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: tools/in-container python3 -I tools/check-server-hostile --bin target/release/burrowd
      - name: A fresh checkout for the release path's dry run on the bare runner
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        with:
          path: bare-release
          persist-credentials: false
      - name: The release path's dry run on the bare runner, as the release build runs it (tools/check-release)
        if: ${{ !cancelled() }}
        working-directory: bare-release
        run: tools/fetch-toolchain && python3 -I tools/check-release --self-test && python3 -I tools/check-release --dry
      - name: Retain row evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-evidence
          path: |
            target/tests
            target/evidence
  macos:
    needs: plan
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) && (contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'macos')) }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: tools/fetch-toolchain
      - run: tools/build --all
      - run: tools/check-test
      - name: burrowd and burrow's terminal rows as the runner's user, native
        if: ${{ !cancelled() }}
        run: python3 -I tools/check-server-local --bin target/native/burrowd
      - name: burrowd and burrow's terminal rows as the runner's user, release
        if: ${{ !cancelled() }}
        run: python3 -I tools/check-server-local --bin target/release/burrowd
      - name: The release path's dry run on the bare runner, as the release build runs it (tools/check-release)
        if: ${{ !cancelled() }}
        run: python3 -I tools/check-release --self-test && python3 -I tools/check-release --dry
  tier:
    name: tier ${{ needs.plan.outputs.tier || 'unplanned' }}
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) && (!cancelled()) }}
    needs:
      - plan
      - plan-test
      - linux
      - macos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I ci/tiers.py verdict
  complete:
    needs: [verify, tier]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ needs.verify.outputs.sha }}
    steps:
      - name: complete release profile
        run: echo 'PROFILE-complete full'
